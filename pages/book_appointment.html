<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Appointment — LifeLink</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="brand">🩸 LifeLink</div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="appointments.html">Appointments</a>
      <a href="hospitals.html">Donation Centres</a>
      <a href="profile.html">Profile</a>
      <a href="login.html">Logout</a>
    </nav>
  </header>

  <div class="section" style="max-width:600px;">
    <h2>Book an Appointment</h2>
    <form action="#" method="post">
      <div class="form-group">
        <label for="centre">Select Donation Centre</label>
        <select id="centre" name="centre">
          <option>Pretoria Central Hospital</option>
          <option>Sunninghill Community Hall</option>
          <option>Steve Biko Academic Hospital</option>
        </select>
      </div>
      <div style="display:flex; gap:16px;">
        <div class="form-group" style="flex:1;">
          <label for="date">Date</label>
          <input type="date" id="date" name="date">
        </div>
        <div class="form-group" style="flex:1;">
          <label for="time">Time Slot</label>
          <select id="time" name="time">
            <option>09:00</option><option>10:00</option><option>11:00</option><option>13:00</option>
          </select>
        </div>
      </div>
      <div class="map-placeholder">Map / Centre Location</div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Confirm Booking</button>
    </form>
  </div>

  <footer>LifeLink Blood Donation &middot; XISD6329</footer>
  <script src="../assets/js/app.js"></script>
</body>
</html>
