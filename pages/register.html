<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — LifeLink</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="brand">🩸 LifeLink</div>
    <nav>
      <a href="../index.html">Home</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <div class="form-wrap" style="max-width:460px;">
    <h2>Become a Donor</h2>
    <form action="#" method="post">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="blood_type">Blood Type</label>
        <select id="blood_type" name="blood_type">
          <option>O+</option><option>O-</option><option>A+</option><option>A-</option>
          <option>B+</option><option>B-</option><option>AB+</option><option>AB-</option>
        </select>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary">Create Account</button>
    </form>
    <div class="form-footer">Already registered? <a href="login.html">Login</a></div>
  </div>

  <footer>LifeLink Blood Donation &middot; XISD6329</footer>
  <script src="../assets/js/app.js"></script>
</body>
</html>
